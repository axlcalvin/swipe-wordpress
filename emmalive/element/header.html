<style>
    /* Emma Live V5 header – Elementor Theme Builder custom CSS. Separate from frontpage. */
    .emma-nav-header {
        --nav-ink: #f9f6ff;
        position: fixed !important;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        z-index: 999999 !important;
        padding: 13px 20px;
        background: transparent !important;
        pointer-events: none;
        font-family: Inter, system-ui, Arial, sans-serif !important
    }

    body.admin-bar .emma-nav-header {
        top: 32px
    }

    @media(max-width:782px) {
        body.admin-bar .emma-nav-header {
            top: 46px
        }
    }

    .emma-nav-header * {
        box-sizing: border-box
    }

    .emma-nav-shell {
        max-width: 1340px;
        margin: auto;
        min-height: 68px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 8px 15px 8px 10px;
        border: 1px solid #ac80ffba;
        border-radius: 999px;
        pointer-events: auto;
        background: linear-gradient(110deg, #1b1259e8, #1c1145df 59%, #20104de8);
        backdrop-filter: blur(23px);
        -webkit-backdrop-filter: blur(23px);
        box-shadow: 0 8px 27px #0007, 0 0 18px #935bfc47;
        transition: background .2s ease, box-shadow .2s ease
    }

    .emma-nav-header.is-scrolled .emma-nav-shell {
        background: linear-gradient(100deg, #110b38f5, #241052f5);
        box-shadow: 0 13px 35px #000a, 0 0 25px #ae5cfb56
    }

    .emma-nav-brand {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-shrink: 0;
        text-decoration: none !important
    }

    .emma-nav-brand img {
        width: 50px;
        height: 50px;
        object-fit: cover;
        object-position: left center;
        border-radius: 50%;
        box-shadow: 0 0 14px #a86dfc4c
    }

    .emma-nav-wordmark {
        font: 900 28px/1 Inter, system-ui, sans-serif !important;
        letter-spacing: -1.5px;
        background: linear-gradient(100deg, #c6eaff, #fff, #ffa4ee);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent !important
    }

    .emma-nav-wordmark span {
        color: #ffa2eb !important;
        -webkit-text-fill-color: #ffa2eb
    }

    .emma-nav-links {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        gap: 3px;
        min-width: 0
    }

    .emma-nav-header .emma-nav-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 41px;
        padding: 0 15px;
        color: #e9e2ff !important;
        font: 650 13px/1.25 Inter, system-ui, sans-serif !important;
        border: 1px solid transparent;
        border-radius: 999px;
        text-decoration: none !important;
        white-space: nowrap;
        position: relative;
        transition: background .2s ease, box-shadow .2s ease, transform .2s ease, color .2s ease
    }

    .emma-nav-header .emma-nav-link:hover,
    .emma-nav-header .emma-nav-link:focus-visible {
        color: white !important;
        transform: translateY(-1px);
        background: linear-gradient(105deg, #8240dc8a, #d549cf67);
        border-color: #d18cf4;
        box-shadow: 0 0 18px #c14bee7c
    }

    .emma-nav-header .emma-nav-link.is-current {
        color: white !important;
        background: linear-gradient(95deg, #723add, #b946d1);
        border-color: #ffa7fc;
        box-shadow: 0 0 20px #d64dedac, inset 0 1px #ffffff59;
        text-shadow: 0 0 7px #fff9
    }

    .emma-nav-actions {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-shrink: 0
    }

    .emma-nav-header .emma-nav-cta {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        min-height: 43px;
        padding: 10px 19px;
        border-radius: 99px !important;
        font: 800 12px/1.2 Inter, system-ui, sans-serif !important;
        text-decoration: none !important;
        white-space: nowrap;
        color: white !important;
        transition: transform .2s, box-shadow .2s, filter .2s
    }

    .emma-nav-header .emma-nav-outline {
        border: 2px solid #d377fb !important;
        background: #22114e95 !important;
        box-shadow: 0 0 12px #a546d35c
    }

    .emma-nav-header .emma-nav-primary {
        border: 1px solid #e8b5ff !important;
        background: linear-gradient(110deg, #fa65e4, #985df7, #46c7ff) !important;
        box-shadow: 0 0 20px #cf5de6a3
    }

    .emma-nav-header .emma-nav-cta:hover,
    .emma-nav-header .emma-nav-cta:focus-visible {
        transform: translateY(-2px);
        filter: brightness(1.13);
        box-shadow: 0 0 27px #e96be0a8, 0 0 16px #80caff80 !important
    }

    .emma-nav-toggle {
        display: none;
        background: #221451;
        border: 1px solid #9b73f0;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        color: white;
        cursor: pointer;
        font-size: 21px;
        flex-shrink: 0
    }

    .emma-nav-mobile-actions {
        display: none
    }

    @media(max-width:1130px) {
        .emma-nav-wordmark {
            font-size: 23px !important
        }

        .emma-nav-brand img {
            width: 42px;
            height: 42px
        }

        .emma-nav-header .emma-nav-link {
            padding: 0 10px;
            font-size: 12px !important
        }

        .emma-nav-header .emma-nav-cta {
            padding: 9px 12px;
            font-size: 11px !important
        }
    }

    @media(max-width:960px) {
        .emma-nav-header {
            padding: 10px 12px
        }

        .emma-nav-shell {
            border-radius: 22px;
            min-height: 60px;
            justify-content: space-between;
            padding: 9px 12px
        }

        .emma-nav-actions {
            display: none
        }

        .emma-nav-toggle {
            display: grid;
            place-items: center
        }

        .emma-nav-links {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            display: none;
            flex-direction: column;
            align-items: stretch;
            gap: 7px;
            padding: 15px;
            border: 1px solid #a879ef;
            border-radius: 20px;
            background: linear-gradient(135deg, #130b39fa, #281351fa);
            box-shadow: 0 18px 45px #000b;
            backdrop-filter: blur(20px)
        }

        .emma-nav-links.is-open {
            display: flex
        }

        .emma-nav-header .emma-nav-link {
            justify-content: flex-start;
            padding: 11px 15px;
            white-space: normal;
            min-height: 45px;
            font-size: 14px !important
        }

        .emma-nav-mobile-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            margin-top: 11px;
            padding-top: 13px;
            border-top: 1px solid #ffffff27
        }

        .emma-nav-mobile-actions .emma-nav-cta {
            width: 100%;
            text-align: center
        }

        .emma-nav-wordmark {
            font-size: 25px !important
        }
    }

    @media(max-width:450px) {
        .emma-nav-mobile-actions {
            grid-template-columns: 1fr
        }

        .emma-nav-header .emma-nav-cta {
            font-size: 13px !important
        }
    }

    @media(prefers-reduced-motion:reduce) {
        .emma-nav-header * {
            transition: none !important
        }
    }

    /* FINAL visual polish: themed navigation stays legible against Elementor/Astra defaults */
    #emma-site-header .emma-nav-link,
    #emma-site-header .emma-nav-cta,
    #emma-site-header .emma-nav-brand {
        text-decoration: none !important;
    }

    #emma-site-header .emma-nav-link.is-current:after {
        content: "";
        position: absolute;
        left: 28%;
        right: 28%;
        bottom: 4px;
        height: 2px;
        border-radius: 6px;
        background: linear-gradient(90deg, #b8ddff, #f9a2ec);
        box-shadow: 0 0 9px #ff83ed;
        pointer-events: none
    }

    #emma-site-header .emma-nav-link:hover:not(.is-current) {
        background: linear-gradient(110deg, #7333c795, #b93fb975);
        border-color: #e29eff;
        box-shadow: 0 0 21px #bf6bff88, inset 0 1px #ffffff26
    }

    #emma-site-header .emma-nav-cta:focus-visible,
    #emma-site-header .emma-nav-link:focus-visible {
        outline: 2px solid #b8ddff;
        outline-offset: 3px
    }

    @media(max-width:960px) {
        #emma-site-header .emma-nav-link.is-current:after {
            left: 16px;
            right: auto;
            width: 36px;
            bottom: 3px
        }
    }


    /* V7: transparent-to-dark header, avoid white strips around header template. */
    html:has(#emma-site-header),
    body:has(#emma-site-header) {
        background-color: #080720 !important;
        margin: 0 !important
    }

    body:has(#emma-site-header) .elementor-location-header,
    body:has(#emma-site-header) [data-elementor-type="header"],
    body:has(#emma-site-header) .elementor-location-header .elementor-widget-container {
        background: transparent !important;
        background-color: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important
    }

    #emma-site-header a,
    #emma-site-header a:hover,
    #emma-site-header a:focus {
        text-decoration: none !important
    }

    /* V5 mobile navigation: centered SVG bars instead of font glyph */
    #emma-site-header .emma-nav-toggle {
        box-sizing: border-box !important;
        padding: 0 !important;
        align-items: center !important;
        justify-content: center !important;
        place-items: center !important;
        width: 48px !important;
        height: 48px !important;
        min-width: 48px !important;
        min-height: 48px !important;
        border: 1px solid #bc8cff !important;
        border-radius: 15px !important;
        background: linear-gradient(145deg, #321b65, #211445) !important;
        color: #f9f4ff !important;
        box-shadow: inset 0 1px 0 #ffffff22 !important;
        line-height: 1 !important;
    }

    #emma-site-header .emma-nav-hamburger {
        width: 23px !important;
        height: 23px !important;
        display: block !important;
        margin: auto !important;
        overflow: visible !important;
        flex: none !important;
    }

    #emma-site-header .emma-nav-hamburger path {
        transform-origin: 12px 12px;
        transition: transform .22s ease, opacity .16s ease;
    }

    #emma-site-header .emma-nav-toggle.is-open .emma-nav-line-top {
        transform: translateY(5px) rotate(45deg);
    }

    #emma-site-header .emma-nav-toggle.is-open .emma-nav-line-middle {
        opacity: 0;
    }

    #emma-site-header .emma-nav-toggle.is-open .emma-nav-line-bottom {
        transform: translateY(-5px) rotate(-45deg);
    }

    #emma-site-header .emma-nav-toggle:hover {
        background: linear-gradient(145deg, #6d37c0, #683a92) !important;
        box-shadow: 0 0 17px #bb6aff77 !important;
    }

    #emma-site-header .emma-nav-toggle:focus-visible {
        outline: 2px solid #b8ddff !important;
        outline-offset: 3px !important;
    }

    @media(max-width:960px) {
        #emma-site-header .emma-nav-toggle {
            display: flex !important;
        }
    }

    @media(max-width:480px) {
        #emma-site-header .emma-nav-shell {
            gap: 8px !important;
            padding: 8px 11px !important;
        }

        #emma-site-header .emma-nav-brand {
            min-width: 0 !important;
            gap: 8px !important;
        }

        #emma-site-header .emma-nav-wordmark {
            font-size: clamp(18px, 5.4vw, 25px) !important;
            white-space: nowrap !important;
        }

        #emma-site-header .emma-nav-brand img {
            width: 43px !important;
            height: 43px !important;
            flex-shrink: 0 !important;
        }
    }

    @media(prefers-reduced-motion:reduce) {
        #emma-site-header .emma-nav-hamburger path {
            transition: none !important;
        }
    }
</style>
