<script>(function(){
const header=document.getElementById('recho-global-header'),menu=document.getElementById('recho-menu-links'),toggle=document.getElementById('recho-menu-toggle');if(!header||!menu||!toggle)return;
const normalize=(p)=>{let s=(p||'/').split('?')[0].split('#')[0];s=s.split('/').filter(Boolean).join('/');return s?'/'+s+'/':'/';};
const pathname=normalize(location.pathname);menu.querySelectorAll('[data-rh-page]').forEach(a=>{const target=normalize(new URL(a.getAttribute('href'),'https://rechoagent.com').pathname);if(target===pathname){a.classList.add('is-active');a.setAttribute('aria-current','page');}});
const close=()=>{menu.classList.remove('is-open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open navigation menu')};
toggle.addEventListener('click',()=>{let next=!menu.classList.contains('is-open');menu.classList.toggle('is-open',next);toggle.setAttribute('aria-expanded',String(next));toggle.setAttribute('aria-label',next?'Close navigation menu':'Open navigation menu');});
menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));document.addEventListener('click',e=>{if(!header.contains(e.target))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});window.addEventListener('resize',()=>{if(innerWidth>1119)close()});
const update=()=>header.classList.toggle('is-scrolled',window.scrollY>16);window.addEventListener('scroll',update,{passive:true});update();
})();</script>
