<!-- POPPOAPP.COM | HEADER V2 | POPPOLIVE.ID V8 DESIGN ADOPTION | ELEMENTOR ALL-IN-ONE -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');
#ppa2-header,#ppa2-header *{box-sizing:border-box}
#ppa2-header{--ppa-grad:linear-gradient(107deg,#2249E4 0%,#4B40EC 31%,#7A35EC 58%,#AE29CC 78%,#E0179A 100%);position:fixed!important;inset:0 0 auto 0!important;width:100%!important;z-index:999990!important;pointer-events:none;font-family:'Manrope',Arial,sans-serif}
#ppa2-header a{text-decoration:none!important}
#ppa2-header .ppa2-shell{pointer-events:auto;position:relative;display:flex;align-items:center;justify-content:space-between;gap:clamp(14px,2.2vw,36px);max-width:1760px;width:calc(100% - 64px);min-height:76px;margin:16px auto 0;padding:9px clamp(20px,1.8vw,32px);border:2px solid rgba(248,240,255,.46);border-radius:24px;background:var(--ppa-grad);box-shadow:0 14px 42px rgba(54,39,133,.24),0 0 0 1px rgba(255,255,255,.1) inset,0 0 20px rgba(147,54,227,.14);isolation:isolate}
#ppa2-header .ppa2-shell:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(104deg,rgba(104,195,255,.17),transparent 38%,rgba(255,158,236,.10));pointer-events:none;z-index:-1}
/* Keep the ORIGINAL logo directly on the colorful surface, no separate white logo tile. */
#ppa2-header .ppa2-brand{display:flex;align-items:center;flex:0 0 auto;min-width:0;max-width:235px}
#ppa2-header .ppa2-logo{display:block;width:auto;max-width:235px;height:44px;object-fit:contain;object-position:left center;filter:drop-shadow(0 1px 3px rgba(14,9,51,.22));transition:filter .2s}
#ppa2-header .ppa2-brand:hover .ppa2-logo{filter:drop-shadow(0 0 9px rgba(255,255,255,.32)) drop-shadow(0 2px 4px rgba(14,9,51,.28))}
#ppa2-header .ppa2-nav{display:flex!important;align-items:center;justify-content:flex-end;gap:clamp(3px,.5vw,9px);margin-left:auto;min-width:0}
#ppa2-header .ppa2-link{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;min-height:40px;padding:8px clamp(8px,.75vw,14px);border:1px solid transparent;border-radius:12px;background:transparent;color:rgba(255,255,255,.94)!important;font:800 clamp(11px,.7vw,13px)/1.25 'Manrope',Arial,sans-serif;transition:background .2s,box-shadow .2s,transform .2s,color .2s}
#ppa2-header .ppa2-link:hover,#ppa2-header .ppa2-link:focus-visible{background:rgba(255,255,255,.16)!important;border-color:rgba(255,255,255,.35);box-shadow:0 7px 17px rgba(26,13,86,.17),0 0 11px rgba(255,255,255,.12);color:#fff!important;transform:translateY(-1px)}
#ppa2-header .ppa2-link.is-active,#ppa2-header .ppa2-link[aria-current=page]{background:linear-gradient(105deg,#5D8BFF,#9874FF 48%,#F653C6)!important;color:#fff!important;border:1px solid rgba(255,255,255,.48);box-shadow:0 6px 20px rgba(31,17,102,.25),0 0 13px rgba(255,148,242,.35)}
#ppa2-header .ppa2-mobile{display:none;position:relative;flex:none;margin-left:auto}
#ppa2-header .ppa2-toggle{list-style:none;display:grid;place-items:center;width:46px;height:46px;margin:0;padding:0;border:1.5px solid rgba(255,255,255,.58);border-radius:14px;background:rgba(255,255,255,.13);box-shadow:0 6px 18px rgba(28,15,88,.18);cursor:pointer;transition:background .2s,box-shadow .2s}
#ppa2-header .ppa2-toggle::-webkit-details-marker{display:none}
#ppa2-header .ppa2-toggle:hover{background:rgba(255,255,255,.23);box-shadow:0 5px 18px rgba(28,15,88,.26)}
#ppa2-header .ppa2-lines{display:grid;gap:5px}
#ppa2-header .ppa2-lines i{display:block;width:22px;height:2.5px;border-radius:5px;background:#fff;transition:transform .2s,opacity .2s}
#ppa2-header .ppa2-mobile[open] .ppa2-lines i:first-child{transform:translateY(7.5px) rotate(45deg)}
#ppa2-header .ppa2-mobile[open] .ppa2-lines i:nth-child(2){opacity:0}
#ppa2-header .ppa2-mobile[open] .ppa2-lines i:last-child{transform:translateY(-7.5px) rotate(-45deg)}
#ppa2-header .ppa2-drawer{display:none;position:absolute;top:calc(100% + 14px);right:0;width:min(380px,calc(100vw - 28px));max-height:min(76vh,610px);overflow-y:auto;padding:13px;border:2px solid transparent;border-radius:20px;background:linear-gradient(#fff,#FBF7FF) padding-box,var(--ppa-grad) border-box;box-shadow:0 20px 55px rgba(35,22,111,.27);z-index:3}
#ppa2-header .ppa2-mobile[open] .ppa2-drawer{display:grid;gap:5px}
#ppa2-header .ppa2-drawer .ppa2-link{justify-content:flex-start;text-align:left;color:#263565!important;padding:13px 15px;font-size:14px;width:100%;min-height:47px;white-space:normal}
#ppa2-header .ppa2-drawer .ppa2-link:hover,#ppa2-header .ppa2-drawer .ppa2-link:focus-visible{color:#612ECF!important;background:linear-gradient(105deg,#EDF2FF,#F8ECFF,#FFEFFA)!important;border-color:#D9A5F9}
#ppa2-header .ppa2-drawer .ppa2-link.is-active,#ppa2-header .ppa2-drawer .ppa2-link[aria-current=page]{color:#fff!important}
@media(max-width:1360px){#ppa2-header .ppa2-shell{width:calc(100% - 44px);min-height:72px;padding:9px 20px}#ppa2-header .ppa2-logo{height:40px}#ppa2-header .ppa2-nav{gap:3px}#ppa2-header .ppa2-link{min-height:38px;padding:8px 9px;font-size:11px}}
@media(max-width:1120px){#ppa2-header .ppa2-shell{width:calc(100% - 32px);min-height:68px;padding:8px 16px}#ppa2-header .ppa2-logo{height:37px}#ppa2-header .ppa2-link{padding:7px 7px;font-size:10.5px}}
@media(max-width:1050px){#ppa2-header .ppa2-shell{width:calc(100% - 24px);min-height:66px;margin-top:10px;padding:8px 14px;border-radius:20px}#ppa2-header .ppa2-nav{display:none!important}#ppa2-header .ppa2-mobile{display:block}#ppa2-header .ppa2-logo{height:40px;max-width:205px}}
@media(max-width:480px){#ppa2-header .ppa2-shell{min-height:62px;padding:7px 11px}#ppa2-header .ppa2-logo{height:36px;max-width:190px}#ppa2-header .ppa2-toggle{width:42px;height:42px}}
body.admin-bar #ppa2-header{top:32px!important}
@media(max-width:782px){body.admin-bar #ppa2-header{top:46px!important}}
@media(prefers-reduced-motion:reduce){#ppa2-header *{transition:none!important}}
</style>

<script>(function(){function init(){var h=document.getElementById('ppa2-header');if(!h||h.dataset.bound)return;h.dataset.bound='1';function norm(v){return ('/'+String(v||'/').split('?')[0].replace(/^\/+|\/+$/g,'')+'/').replace(/^\/\/$/,'/').toLowerCase()}var p=norm(location.pathname);h.querySelectorAll('a[data-path]').forEach(function(a){var u=norm(a.getAttribute('data-path'));var active=u==='/'?p==='/':p===u||p.indexOf(u)===0;if(u==='/category/blog/'&&p.indexOf('/category/blog/')===0)active=true;a.classList.toggle('is-active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});var d=h.querySelector('details');if(d){d.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){d.open=false})});document.addEventListener('keydown',function(e){if(e.key==='Escape')d.open=false});document.addEventListener('click',function(e){if(d.open&&!d.contains(e.target))d.open=false})}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script>
