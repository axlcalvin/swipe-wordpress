<script>
(function(){
  function init(){
    var root=document.querySelector('[data-poppo-header]');
    if(!root||root.dataset.poppoReady==='1')return;
    root.dataset.poppoReady='1';
    var admin=document.getElementById('wpadminbar');
    function offset(){root.style.setProperty('--ph-admin-top',admin&&getComputedStyle(admin).position==='fixed'?admin.getBoundingClientRect().height+'px':'0px');}
    // Do not insert spacer or move the header outside Elementor.
    // Fixed navigation stays within its original HTML widget.
    var toggle=root.querySelector('.ph-toggle'),closeBtn=root.querySelector('.ph-close'),shade=root.querySelector('.ph-shade'),drawer=root.querySelector('.ph-drawer');
    if(!toggle||!drawer||!shade)return;
    var originalBodyOverflow='',previousFocus=null;
    function open(){previousFocus=document.activeElement;originalBodyOverflow=document.body.style.overflow;root.classList.add('is-open');shade.classList.add('is-open');drawer.classList.add('is-open');toggle.setAttribute('aria-expanded','true');toggle.setAttribute('aria-label','Close navigation');drawer.setAttribute('aria-hidden','false');drawer.removeAttribute('inert');document.body.style.overflow='hidden';closeBtn.focus();}
    function close(){if(!root.classList.contains('is-open'))return;root.classList.remove('is-open');shade.classList.remove('is-open');drawer.classList.remove('is-open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open navigation');drawer.setAttribute('aria-hidden','true');drawer.setAttribute('inert','');document.body.style.overflow=originalBodyOverflow;if(previousFocus&&previousFocus.focus)previousFocus.focus();}
    toggle.addEventListener('click',function(){root.classList.contains('is-open')?close():open()});
    closeBtn.addEventListener('click',close);shade.addEventListener('click',close);
    drawer.querySelectorAll('a').forEach(function(a){a.addEventListener('click',close)});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')close();if(e.key==='Tab'&&root.classList.contains('is-open')){var items=Array.from(drawer.querySelectorAll('a,button')).filter(function(x){return x.offsetParent!==null});if(!items.length)return;var first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
    /* Universal active navigation: routes, common WordPress aliases, and
       concrete page content used by Elementor Preview. Exactly one active. */
    function normalize(path){
      return ('/'+String(path||'/').replace(/^\/+|\/+$/g,'')).replace(/\/{2,}/g,'/').toLowerCase();
    }
    function detectPage(){
      var rawPath=normalize(window.location.pathname);
      var segments=rawPath.split('/').filter(Boolean);
      var last=segments[segments.length-1]||'';
      // Preview-specific fallback: the preview URL may be /?elementor-preview=ID.
      if(document.querySelector('.pp-host-v2'))return 'host';
      if(document.querySelector('.pp-home-v1'))return 'home';
      if(document.querySelector('.pp-agency-v1,.pp-agency-v2,.poppo-agency-page,[data-poppo-page="agency"]'))return 'agency';
      if(document.querySelector('.pp-about-v1,.pp-about-v2,.poppo-about-page,[data-poppo-page="about"]'))return 'about';
      if(document.querySelector('.pp-contact-v1,.pp-contact-v2,.poppo-contact-page,[data-poppo-page="contact"]'))return 'contact';
      if(rawPath==='/')return 'home';
      if(['host','host-cooperation','become-a-host','hosts'].includes(last))return 'host';
      if(['agency','agency-cooperation','become-an-agent','become-an-agency','agent'].includes(last))return 'agency';
      if(['about','about-us','about-poppo'].includes(last))return 'about';
      if(['contact','contact-us','contact-support'].includes(last))return 'contact';
      if(rawPath==='/blog'||rawPath.indexOf('/category/blog')===0||rawPath.indexOf('/blog/')===0)return 'blog';
      // WordPress blog single post often includes /category/blog/ in its path.
      if(segments.indexOf('blog')!==-1)return 'blog';
      return '';
    }
    var page=detectPage();
    var pageForHref={'/':'home','/host':'host','/agency':'agency',
      '/about-us':'about','/category/blog':'blog','/contact':'contact'};
    root.querySelectorAll('.ph-link,.ph-drawer-link').forEach(function(a){
      var target='';
      try{target=pageForHref[normalize(new URL(a.href,window.location.href).pathname)]||'';}catch(e){}
      if(target&&target===page)a.setAttribute('aria-current','page');
      else a.removeAttribute('aria-current');
    });
    var ticking=false;function update(){root.classList.toggle('is-scrolled',window.scrollY>12);ticking=false;}
    window.addEventListener('scroll',function(){if(!ticking){ticking=true;window.requestAnimationFrame(update)}},{passive:true});
    window.addEventListener('resize',function(){offset();if(window.innerWidth>980)close()},{passive:true});
    offset();update();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
